name: Update PM2.5 data

on:
  schedule:
    # Every 15 minutes (:00, :15, :30, :45 UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest readings
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update PM2.5 data"
          git push
